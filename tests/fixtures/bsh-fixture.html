<!doctype html><meta charset="utf-8"><title>博西双语控件回归页</title>
<style>label{display:inline-block;border:1px solid #ccc;margin:4px;padding:4px}.sd-Menu-content-item-fixture,[class*=sd-basic-year-item],[class*=sd-basic-date-item],.sd-basic-selector-year-fixture{cursor:pointer;padding:3px}.menu{border:1px solid #999}.sd-basic-disabled-fixture,.sd-basic-fade-fixture{color:#aaa}</style>
<main></main><button id="submit">预览并提交 / Preview and submit</button>
<script>
window.submitCount=0;document.querySelector('#submit').onclick=()=>submitCount++;
const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sept','Oct','Nov','Dec'];
function row(title,kind='text',options=[]){
 const r=document.createElement('div');r.className='apply-field-fixture';const h=document.createElement('div');h.className='title-fixture';h.textContent=title;r.append(h);
 function dropdown(opts){const d=document.createElement('div');d.className='sd-Dropdown-container-fixture';const l=document.createElement('label');l.className='sd-Select-container-fixture';const span=document.createElement('span'),input=document.createElement('input');input.type='text';const clear=document.createElement('button');clear.setAttribute('aria-label','Clear');clear.onclick=e=>{e.preventDefault();input.value='';span.textContent='';};l.append(span,input,clear);d.append(l);r.append(d);
  function render(){d.querySelector('.menu')?.remove();const menu=document.createElement('div');menu.className='menu';for(const s of opts.filter(s=>s.includes(input.value))){const option=document.createElement('div');option.className='sd-Menu-content-item-fixture';if(title==='学校名称 / School'){const main=document.createElement('div'),sub=document.createElement('div');main.textContent=s.split(' / ')[0];sub.className='sd-Menu-sub-title-fixture';sub.textContent=s.split(' / ')[1];option.append(main,sub);}else option.textContent=s;option.onclick=()=>{span.textContent=s;input.value='';menu.remove();if(kind==='range'&&[...r.querySelectorAll('input')].indexOf(input)%2===0)[...r.querySelectorAll('label')].forEach((l,i)=>{if(i%2===1)l.querySelector('span').textContent='1';});};menu.append(option);}d.append(menu);}
  input.onclick=render;input.oninput=render;return input;
 }
 if(kind==='select')dropdown(options);
 else if(kind==='range'){r.classList.add('date_info-fixture');for(let i=0;i<4;i++)dropdown(i%2===0?Array.from({length:15},(_,i)=>String(2018+i)):Array.from({length:12},(_,i)=>String(i+1)));}
 else if(kind==='identity'||kind==='phone'){dropdown(kind==='identity'?["身份证 / China's Resident Identity Card"]:['+86']);r.append(document.createElement('input'));}
 else if(kind==='checkbox'){const l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';l.append(i,options[0]||'至今 / Present');r.append(l);}
 else if(kind==='monthPicker'||kind==='dayPicker'){
  r.classList.add('day_info-fixture');const d=document.createElement('div');d.className='sd-Dropdown-container-fixture';const input=document.createElement('input');input.type='text';input.readOnly=true;input.placeholder=kind==='dayPicker'?'日期（年月日） / Date (year-month-day)':title;const l=document.createElement('label');l.append(input);d.append(l);r.append(d);
  let year=kind==='dayPicker'?2026:1990,month=11,mode=kind==='dayPicker'?'day':'month';
  function render(){d.querySelector('.sd-panal-menu-wrapper-fixture')?.remove();const panel=document.createElement('div');panel.className='sd-panal-menu-wrapper-fixture';const header=document.createElement('div'),y=document.createElement('span');y.className='sd-basic-selector-year-fixture';y.textContent=mode==='year'?`${Math.floor(year/10)*10} - ${Math.floor(year/10)*10+9}`:`${year}年`;y.onclick=()=>{mode='year';render();};
   for(const [direction,name] of [[-1,'icondoubleLeft'],[1,'icondoubleRight']]){const arrow=document.createElement('span');arrow.className='sd-Icon-'+name+'-fixture';arrow.textContent=direction<0?'‹':'›';arrow.onclick=()=>{year+=direction*(mode==='year'?10:1);render();};header.append(arrow);}header.append(y);panel.append(header);
   if(mode==='year'){for(let n=Math.floor(year/10)*10-1;n<=Math.floor(year/10)*10+10;n++){const wrap=document.createElement('div');if(n<Math.floor(year/10)*10||n>Math.floor(year/10)*10+9)wrap.className='sd-basic-disabled-fixture';const item=document.createElement('div');item.className='sd-basic-year-item-fixture';item.textContent=n;item.onclick=()=>{year=n;mode='month';render();};wrap.append(item);panel.append(wrap);}}
   else if(mode==='month'){months.forEach((m,i)=>{const item=document.createElement('div');item.className='sd-basic-year-item-fixture';item.textContent=m;item.onclick=()=>{month=i+1;if(kind==='monthPicker'){input.value=`${year}-${String(month).padStart(2,'0')} (26岁 / Years old)`;panel.remove();}else{mode='day';render();}};panel.append(item);});}
   else{const table=document.createElement('table');for(let i=1;i<=31;i++){const td=document.createElement('td'),item=document.createElement('div');item.className='sd-basic-date-item-fixture';item.textContent=i;item.onclick=()=>{input.value=`${year}-${String(month).padStart(2,'0')}-${String(i).padStart(2,'0')}`;panel.remove();};td.append(item);table.append(td);}const faded=document.createElement('td');faded.className='sd-basic-fade-fixture';faded.innerHTML='<div class="sd-basic-date-item-fixture">3</div>';table.append(faded);panel.append(table);}
   d.append(panel);
  }input.onclick=render;
 }
 else r.append(document.createElement(kind==='textarea'?'textarea':'input'));
 h.onclick=()=>r.querySelectorAll('.menu,.sd-panal-menu-wrapper-fixture').forEach(e=>e.remove());return r;
}
function block(name,key,build){const b=document.createElement('section');b.className='apply-block-fixture';b.dataset.group=key;const h=document.createElement('div');h.className='blockTitle-fixture';h.textContent=name;const add=document.createElement('button');add.textContent='添加 / Add';h.append(add);b.append(h);document.querySelector('main').append(b);add.onclick=()=>{const r=document.createElement('div');r.className='apply-fields-fixture multi-fixture';build(r);b.append(r);};add.click();return b;}
block('个人信息 / Personal info','basic',r=>r.append(row('姓名 / Name'),row('国家/地区 / Country/Region','select',['中国/China','德国/Germany']),row('性别 / Gender','select',['男/Male','女/Female']),row('出生日期 (年龄) / Birth Date (Age)','monthPicker'),row('证件号码 / ID number','identity'),row('手机号码 / Mobile','phone'),row('紧急联系人姓名 / Emergency Contact Name'),row('紧急联系人电话 / Emergency Contact Telephone')));
block('教育背景 / Education','education',r=>r.append(row('就读时间 / Education period','range'),row('学校名称 / School','select',['示例理工大学 / Shanghai University of Engineering Science','示例科技学院 / Jiangsu University of Technology']),row('学历 / Degree','select',['本科 / Bachelor','硕士 / Master']),row('学位 / Degree','select',['学士 / Bachelor','硕士 / Master']),row('全日制/非全日制 / Full/Part Time','select',['全日制 / Full Time','非全日制 / Part Time']),row('专业名称 / Major','select',['机械工程 / Mechanical Engineering','车辆工程 / Vehicle Engineering'])));
block('工作经历 / Work experience','experience',r=>{const d=row('起止时间 / Period','range');const label=row('','checkbox').querySelector('label');d.append(label);r.append(d,row('公司名称 / Company'),row('职位名称 / Job title'),row('是否签订竞业限制条款 / Competition Agreement?','select',['是/Yes','否/No']));});
block('家庭背景 / Family Background','family',r=>r.append(row('姓名 / Name'),row('工作单位 / Employer')));
block('资质认证或培训经历 / Certificate Qualification or Training Experience','training',r=>r.append(row('时间 / Time','dayPicker'),row('内容 / Content'),row('备注 / Remarks','textarea')));
block('入职相关信息 / On-Boarding Related Information','onboarding',r=>r.append(row('您有无犯罪记录？ / Have you ever been convicted of any crime?','select',['是/Yes','否/No']),row('本人承诺 / I DECLARE','checkbox',['本人承诺！ / I DECLARE ！'])));
</script>
