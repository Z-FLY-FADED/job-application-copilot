<!doctype html><meta charset="utf-8"><title>瑞声控件回归测试</title><style>.atsx-form-item{margin:8px}.atsx-date-picker-period-month-label,[role=combobox],.atsx-date-picker-period-month-panel-list-item,[role=option]{cursor:pointer;padding:4px;border:1px solid #ccc;display:inline-block}input{margin:3px}.atsx-date-picker-period-hidden-input{display:none}.atsx-date-picker-period-month-panel,.atsx-select-dropdown{border:1px solid #444}</style><main></main><label><input id="privacy" type="checkbox">我已阅读并同意隐私政策</label><button id="submit">提交简历</button><script>
window.submitCount=0;document.querySelector('#submit').onclick=()=>submitCount++;
function closeMenus(){document.querySelectorAll('.atsx-select-dropdown,.atsx-date-picker-period-month-panel').forEach(e=>e.style.display='none');}
function field(title,kind,id,options=[]){const r=document.createElement('div');r.className='atsx-form-item';const head=document.createElement('div');head.className='atsx-form-item-label';head.innerHTML='<label><span class="customResumeForm-fieldName">'+title+'</span></label>';head.onclick=closeMenus;r.append(head);
 if(kind==='range'){
  const wrap=document.createElement('div');wrap.className='atsx-date-picker-period-month';for(let p=0;p<2;p++){const el=document.createElement('div');el.className='atsx-date-picker-period-month-label';el.dataset.cy=id+(p?'End':'Begin');el.innerHTML='<span class="atsx-date-picker-period-month-label-year">YYYY</span>-<span class="atsx-date-picker-period-month-label-month">MM</span>';el.onclick=()=>{closeMenus();const menu=document.createElement('div');menu.className='atsx-date-picker-period-month-panel';for(const s of [...Array.from({length:20},(_,i)=>String(2020+i)),...Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0'))]){const item=document.createElement('div');item.className='atsx-date-picker-period-month-panel-list-item';item.textContent=s;if(s==='2035')item.classList.add('disabled');item.onclick=()=>{if(item.classList.contains('disabled'))return;el.querySelector(s.length===4?'.atsx-date-picker-period-month-label-year':'.atsx-date-picker-period-month-label-month').textContent=s;if(s.length===2)menu.style.display='none';};menu.append(item);}document.body.append(menu);};wrap.append(el);}const hidden=document.createElement('input');hidden.className='atsx-date-picker-period-hidden-input';wrap.append(hidden);r.append(wrap);
 }else if(kind==='select'){
  const wrap=document.createElement('div');wrap.className='atsx-select';const combo=document.createElement('div');combo.setAttribute('role','combobox');combo.className='atsx-select-selection--single';const selected=document.createElement('div');selected.className='atsx-select-selection-selected-value';const input=document.createElement('input');input.id=id;combo.append(selected,input);wrap.append(combo);r.append(wrap);const mid='menu-'+id.replace(/[^a-z0-9]/gi,'');combo.setAttribute('aria-controls',mid);let menu;
  function render(){if(menu)menu.remove();menu=document.createElement('div');menu.id=mid;menu.className='atsx-select-dropdown';for(const s of options.filter(s=>s.includes(input.value))){const item=document.createElement('div');item.setAttribute('role','option');item.textContent=s;item.onclick=()=>{selected.textContent=s;input.value='';menu.style.display='none';combo.setAttribute('aria-expanded','false');};menu.append(item);}document.body.append(menu);}
  combo.onclick=e=>{if(e.target.closest('[role=option]'))return;closeMenus();combo.setAttribute('aria-expanded','true');render();};input.oninput=render;
 }else{const el=document.createElement(kind==='textarea'?'textarea':'input');el.id=id;el.type='text';if(kind==='month'){const w=document.createElement('div');w.className='atsx-date-picker';w.append(el);r.append(w);}else r.append(el);}
 return r;
}
function section(name,key,build,count=1){const p=document.createElement('section');p.className='createFormSection__fixture';p.innerHTML='<div class="createFormSection-left">'+name+'</div>';const list=document.createElement('div');p.append(list);const add=document.createElement('button');add.textContent='添加';add.onclick=()=>{const i=list.children.length,r=document.createElement('div');r.className='resumeEditForm-item';r.dataset.key=key;r.dataset.index=i;build(r,i);list.append(r);};p.append(add);document.querySelector('main').append(p);for(let i=0;i<count;i++)add.click();return p;}
section('教育经历','education',(r,i)=>{r.append(field('起止时间','range',`education[${i}].periodInput`),field('学校名称','select',`education[${i}].school`,['示例科技学院','示例理工大学']),field('专业','text',`education[${i}].major`),field('学历','select',`education[${i}].degree`,['本科','硕士']),field('培养模式','select',`education[${i}].mode`,['全日制','非全日制']));r.querySelector('[id$=".school"]').value=i?'示例理工大学':'示例科技学院';},2);
section('项目经历','project',(r,i)=>r.append(field('起止时间','range',`project[${i}].periodInput`),field('项目名称','text',`project[${i}].name`),field('项目角色','text',`project[${i}].role`),field('项目职责','textarea',`project[${i}].description`)));
section('获奖','award',(r,i)=>r.append(field('获奖名称','text',`award[${i}].title`),field('获奖时间','month',`award[${i}].date`),field('描述','textarea',`award[${i}].desc`)));
section('基本信息','basic',r=>r.append(field('英文名（无请写拼音，请勿带符号）','text','english'),field('期望月薪（税前）','text','salary'),field('期望年薪','text','annual'),field('证明人','text','reference')));
</script>
