<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>求职快填 · 本地测试表单</title><link rel="stylesheet" href="ui.css"></head><body><div class="workspace" style="max-width:850px"><header><div class="eyebrow">LOCAL PRACTICE</div><h1>招聘申请 · 测试表单</h1><p class="muted" style="margin-top:12px">此页面仅用于本地练习，没有提交入口。打开插件，识别并填写即可。通过 file:// 打开时，请先在扩展详情开启“允许访问文件网址”。</p></header>
<form><section class="card"><h2>基本信息</h2><div class="form-grid" style="margin-top:20px">
<label class="input-field">姓名<input name="fullName" autocomplete="name"></label><label class="input-field">手机号<input name="mobile" type="tel"></label><label class="input-field">电子邮箱<input name="email" type="email"></label><label class="input-field">性别<select name="gender"><option value="">请选择</option><option value="M">男</option><option value="F">女</option></select></label><label class="input-field">出生日期<input name="birthDate" type="date"></label><label class="input-field">最高学历<select name="degree"><option value="">请选择</option><option value="bachelor">本科</option><option value="master">硕士</option><option value="phd">博士</option></select></label><label class="input-field">现居城市<input name="currentCity"></label><label class="input-field">期望月薪（元）<input name="salary" type="number"></label><label class="input-field wide">自我评价<textarea name="summary"></textarea></label></div></section>
<fieldset class="card" style="margin-top:20px"><legend>教育经历 1</legend><div class="form-grid"><label class="input-field">学校名称<input name="edu_school"></label><label class="input-field">专业名称<input name="edu_major"></label><label class="input-field">入学时间<input name="edu_start" type="month"></label><label class="input-field">毕业时间<input name="edu_end" type="month"></label></div></fieldset>
<fieldset class="card" style="margin-top:20px"><legend>工作经历 1</legend><div class="form-grid"><label class="input-field">公司名称<input name="company1"></label><label class="input-field">职位名称<input name="title1"></label><label class="input-field">开始时间<input name="start1" type="month"></label><label class="input-field">结束时间<input name="end1" type="month"></label><label class="input-field wide">工作内容<textarea name="description1"></textarea></label></div></fieldset>
<fieldset class="card" style="margin-top:20px"><legend>工作经历 2</legend><div class="form-grid"><label class="input-field">公司名称<input name="company2"></label><label class="input-field">职位名称<input name="title2"></label></div></fieldset>
<section class="card" style="margin-top:20px"><h2>这些项目需要手动完成</h2><div class="form-grid" style="margin-top:20px"><label class="input-field">验证码<input name="captcha"></label><label class="input-field">上传简历<input name="resume" type="file"></label><label class="input-field">密码<input type="password"></label><label class="check"><input type="checkbox"> 我已阅读并同意隐私条款</label></div></section></form></div></body></html>
